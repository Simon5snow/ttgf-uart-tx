# Tiny Tapeout project information
project:
  title:        "Small core"      # Project title
  author:       "Simon Perrin"      # Your name
  discord:      ""      # Your discord username, for communication and automatically assigning you a Tapeout role (optional)
  description:  "Small core with 32 adress for instruction memory of 13 bits for each instruction transmitter that works at 50MHz. The only instruction possible are SET, JMP and OUT"      # One line description of what your project does
  language:     "Verilog" # other examples include SystemVerilog, Amaranth, VHDL, etc
  clock_hz:     25000000       # Clock frequency in Hz (or 0 if not applicable)

  # How many tiles your design occupies? A single tile is about 340x160 uM.
  tiles: "1x1"          # Valid values: 1x1, 1x2, 2x2, 3x2, 4x2, 3x4 or 4x4

  # Your top module name must start with "tt_um_". Make it unique by including your github username:
  top_module:  "tt_um_Simon5snow"

  # List your project's source files here.
  # Source files must be in ./src and you must list each source file separately, one per line.
  # Don't forget to also update `PROJECT_SOURCES` in test/Makefile.
  source_files:
    - "project.v"
    - "core.v"

# The pinout of your project. Leave unused pins blank. DO NOT delete or add any pins.
# This section is for the datasheet/website. Use descriptive names (e.g., RX, TX, MOSI, SCL, SEG_A, etc.).
pinout:
  # Inputs
  ui[0]: "bit_instruction[0]"
  ui[1]: "bit_instruction[1]"
  ui[2]: "bit_instruction[2]"
  ui[3]: "bit_instruction[3]"
  ui[4]: "bit_instruction[4]"
  ui[5]: "bit_instruction[5]"
  ui[6]: "bit_instruction[6]"
  ui[7]: "bit_instruction[7]"

  # Outputs
  uo[0]: "tx"
  uo[1]: ""
  uo[2]: ""
  uo[3]: ""
  uo[4]: ""
  uo[5]: ""
  uo[6]: ""
  uo[7]: ""

  # Bidirectional pins
  uio[0]: "bit_instruction[8]" #input
  uio[1]: "bit_instruction[9]" #input
  uio[2]: "bit_instruction[10]" #input
  uio[3]: "bit_instruction[11]" #input
  uio[4]: "bit_instruction[12]" #input
  uio[5]: "strobe" #input
  uio[6]: "loading" #input
  uio[7]: ""

# Do not change!
yaml_version: 6
